name: Build aSPICE APK

on:
  workflow_dispatch:
  push:
    branches:
      - ci/build-aspice-apk
    paths:
      - '.github/workflows/build-aspice.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Locate GitHub runner Android SDK tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -n "$SDKMANAGER"
          SDKMANAGER_BIN="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_BIN" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Download upstream prebuilt native dependencies
        run: ./download-prebuilt-dependencies.sh

      - name: Patch stale FreeRDP Java API in prebuilt bundle
        run: |
          patch --batch --forward -p1 \
            -d remoteClientLib/jni/libs/deps/FreeRDP \
            < remoteClientLib/jni/libs/19_freerdp_add_glyph_cache_to_bookmark.patch
          grep -n "setGlyphCache" \
            remoteClientLib/jni/libs/deps/FreeRDP/client/Android/Studio/freeRDPCore/src/main/java/com/freerdp/freerdpcore/domain/BookmarkBase.java

      - name: Prepare project
        run: ./bVNC/prepare_project.sh --skip-build libs nopath

      - name: Build aSPICE debug APK
        run: ./gradlew :aSPICE-app:assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find aSPICE-app/build/outputs/apk -type f -name '*.apk' -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload aSPICE APKs
        uses: actions/upload-artifact@v4
        with:
          name: aSPICE-debug-apks
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
